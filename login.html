<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | MIKLAM Tours</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo"><a href="index.html" style="color: inherit;">MIKLAM TOURS</a></div>
        <a href="index.html" class="btn">Back to Home</a>
    </header>

    <!-- Auth Section -->
    <section class="auth-section">
        <div class="auth-card fade-in">
            
            <!-- Toggle Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Google Sign-In Button -->
            <div style="padding: 30px 30px 0;">
                <button type="button" id="googleSignInBtn" class="btn google-btn">
                    <!-- SVG LOGO -->
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    </svg>
                    Continue with Google
                </button>
                <div class="divider">
                    <span>OR</span>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active-form">
                <span class="kicker" style="margin-bottom: 10px;">BASE CAMP LOGIN</span>
                <h2 style="margin-bottom: 20px; color: var(--primary-blue);">Welcome Back</h2>
                
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <div class="auth-extras">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-full">Sign In</button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <span class="kicker" style="margin-bottom: 10px;">JOIN THE EXPEDITION</span>
                <h2 style="margin-bottom: 20px; color: var(--primary-blue);">Join MIKLAM Tours</h2>
                
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="Enter WhatsApp number" required>
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">Create Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a strong password" required>
                </div>
                
                <button type="submit" class="btn btn-full">Create Account</button>
            </form>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom" style="border-top: none;">
            <p class="copyright">&copy; 2026 MIKLAM Tours. All Rights Reserved.</p>
        </div>
    </footer>

<script type="module" src="script.js?v=2"></script>
</body>
</html>
